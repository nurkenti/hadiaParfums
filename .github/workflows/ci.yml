# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest


    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: hadiaParfums
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps: 
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'
    
    - name: Run migrations
      run: |
        docker run --rm \
          -v ${{ github.workspace }}/migration\
          --network host\
          migrate/migrate\
          -path=/migrations\
          -database "postgresql://root:secret@localhost:5432/hadiaParfums?sslmode=disable" up

    - name: Build
      run: go build -v ./...

    - name: Test
      env:
       # Передаём переменные окружения, если код использует их для подключения:
          DB_SOURCE: "postgresql://root:secret@localhost:5432/hadiaParfums?sslmode=disable"
          DB_DRIVER: "postgres"
          DB_NAME: "hadiaParfums"
          DB_USER: "root"
          DB_PASSWORD: "secret"
          DB_HOST: "localhost"
          DB_PORT: "5432"
      run: go test -v ./...

