version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: hadia_postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migration/000001_init.up.sql:/docker-entrypoint-initdb.d/01_init.sql

  bot:
    build: .
    container_name: hadia_bot
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - DB_HOST=hadia_postgres

volumes:
  pgdata:

